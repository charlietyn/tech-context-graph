name: Graphify Real Integration (ARGEns v6)
on:
  push:
    branches: [agents-total-integration]
    paths:
      - "src/**"
      - "scripts/smoke-graphify-real.cjs"
      - ".github/workflows/graphify-real-integration.yml"
      - "package-lock.json"
  workflow_dispatch:

jobs:
  graphify-code-only:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GRAPHIFY_BACKEND: none
      GRAPHIFY_QUERY_LOG_DISABLE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install official pinned Graphify CLI
        run: |
          uv tool install "graphifyy==0.9.102"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Verify graphify build
        run: graphify --version
      - name: Install and compile TCG
        run: |
          npm ci
          npm run build
      - name: Real Graphify extraction, published pointer and query contract
        run: node scripts/smoke-graphify-real.cjs
      - name: Publish sanitized integration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tcg-graphify-real-evidence
          path: ci-evidence/graphify-smoke.json
          if-no-files-found: ignore
