name: Quality

on:
  pull_request:
  push:
    branches: [main, agents-total-integration]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run lint:types

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: CLI smoke test
        run: node dist/main.js --help

      - name: CONTRACT-002 CLI JSON smoke test
        run: node scripts/smoke-technology-contract.cjs
