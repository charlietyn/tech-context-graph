version: 1

# Editable catalog used by `tcg project:discover`.
# Most users do not need to change it. For custom rules, copy this file as
# `technology-catalog.override.yaml` in the workspace and modify only the
# required profiles.
settings:
  default_max_depth: 8
  default_min_confidence: 60
  maximum_directories: 25000
  stop_at_detected_repository: true
  include_unknown_git_repositories: true
  # When true, a container folder that is not a project itself but whose subfolders are
  # >=2 detected projects is grouped as one composite technology (its children become
  # nested members under technologies/<technology>/<member>). Set to false to keep every
  # subfolder as an independent, flat repository.
  compose_members: true
  exclude_directories:
    - .git
    - .svn
    - .hg
    - node_modules
    - vendor
    - dist
    - build
    - out
    - coverage
    - .coverage
    - .next
    - .nuxt
    - .output
    - .cache
    - .turbo
    - .nx
    - target
    - bin
    - obj
    - .idea
    - .vscode
    - .venv
    - venv
    - __pycache__
    - storage
    - bootstrap/cache

category_aliases:
  backend: backend
  back-end: backend
  server: backend
  servers: backend
  api: backend
  frontend: frontend
  front-end: frontend
  web: frontend
  client: frontend
  mobile: mobile
  movil: mobile
  móvil: mobile
  apps: mobile
  infrastructure: infrastructure
  infra: infrastructure
  devops: infrastructure
  libraries: library
  library: library
  libs: library
  packages: library

profiles:
  nestjs:
    display_name: NestJS
    default_category: backend
    ignore_profile: nestjs
    files_any: [nest-cli.json]
    package_dependencies_any: ['@nestjs/core', '@nestjs/common']

  laravel:
    display_name: Laravel
    default_category: backend
    ignore_profile: laravel
    files_any: [artisan]
    composer_require_any: [laravel/framework]

  spring-boot:
    display_name: Spring Boot
    default_category: backend
    ignore_profile: springboot
    files_any: [pom.xml, build.gradle, build.gradle.kts]
    text_markers:
      - file: pom.xml
        contains_any: [spring-boot-starter, org.springframework.boot]
      - file: build.gradle
        contains_any: [org.springframework.boot, spring-boot]
      - file: build.gradle.kts
        contains_any: [org.springframework.boot, spring-boot]

  nuxt:
    display_name: Nuxt
    default_category: frontend
    ignore_profile: vue-nuxt
    files_glob_any: [nuxt.config.ts, nuxt.config.js, nuxt.config.mjs]
    package_dependencies_any: [nuxt]

  vue:
    display_name: Vue
    default_category: frontend
    ignore_profile: vue-nuxt
    package_dependencies_any: [vue, '@vue/consolidate', '@vue/router-root', '@pinia/root']
    member_key_aliases:
      core: core
      router: router
      pinia: vue-pinia

  primevue:
    display_name: PrimeVue
    default_category: frontend
    ignore_profile: primevue
    package_dependencies_any: ['@primevue/monorepo', primevue]

  nextjs:
    display_name: Next.js
    default_category: frontend
    ignore_profile: nextjs
    files_glob_any: [next.config.js, next.config.mjs, next.config.ts]
    package_dependencies_any: [next, nextjs-project]

  react:
    display_name: React
    default_category: frontend
    ignore_profile: react-expo
    package_dependencies_any: [react, react-dom]

  expo:
    display_name: Expo / React Native
    default_category: mobile
    ignore_profile: react-expo
    files_glob_any: [app.json, app.config.js, app.config.ts]
    package_dependencies_any: [expo, react-native]

  flutter:
    display_name: Flutter
    default_category: mobile
    ignore_profile: flutter
    files_any: [pubspec.yaml]
    text_markers:
      - file: pubspec.yaml
        contains_any: ['sdk: flutter', 'flutter:']

  angular:
    display_name: Angular
    default_category: frontend
    ignore_profile: common
    files_any: [angular.json]
    package_dependencies_any: ['@angular/core']

  dotnet:
    display_name: .NET
    default_category: backend
    ignore_profile: common
    files_glob_any: ['*.sln', '*.slnx', '*.csproj', '*.fsproj', '*.vbproj']

  python:
    display_name: Python
    default_category: backend
    ignore_profile: common
    files_any: [pyproject.toml, requirements.txt, setup.py]

  nodejs:
    display_name: Node.js / TypeScript
    default_category: backend
    ignore_profile: common
    files_any: [package.json]

  php:
    display_name: PHP / Composer
    default_category: backend
    ignore_profile: common
    files_any: [composer.json]

  go:
    display_name: Go
    default_category: backend
    ignore_profile: common
    files_any: [go.mod]

  rust:
    display_name: Rust
    default_category: backend
    ignore_profile: common
    files_any: [Cargo.toml]

  terraform:
    display_name: Terraform / Infrastructure
    default_category: infrastructure
    ignore_profile: common
    files_glob_any: ['*.tf', '*.tfvars']
